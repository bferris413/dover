[package]
name = "dover"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.27", features = ["derive"] }
colored = "3.0.0"
git2 = "0.20.0"
prettyplease = { version = "0.2.29", features = ["verbatim"] }
proc-macro2 = { version = "1.0.94", features = ["span-locations"] }
quote = "1.0.38"
syn = { version = "2.0.96", features = ["extra-traits", "full", "parsing"] }
